<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .cube div{
      width: 100px;
      height: 100px;
      position: absolute;
    }
    .cube{
      width: 100px;
      height: 100px;
      position: absolute;
      transform-style: preserve-3d;
      transform: rotateX(-25deg) rotateY(25deg);
      animation: rotate 5s infinite linear;
    }
    @keyframes rotate {
      0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
      100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
    }
  </style>
</head>
<body>
<div class="scene" style="display: flex; flex-wrap: wrap; width: 100%; height: 100vh; justify-content: center; align-items: center; perspective: 800px;">
    <div class="cube">
    <div style="background-color: rgb(255, 0, 0); transform: translateZ(50px);"></div>
    <div style="background-color: rgb(255, 255, 255); transform: rotateY(180deg) translateZ(50px);"></div>
    <div style="background-color: rgb(30, 255, 0); transform: rotateY(90deg) translateZ(50px);"></div>
    <div style="background-color: rgb(4, 0, 255); transform: rotateY(-90deg) translateZ(50px);"></div>
    <div style="background-color: rgb(255, 251, 0); transform: rotateX(90deg) translateZ(50px);"></div>
    <div style="background-color: rgb(255, 123, 0); transform: rotateX(-90deg) translateZ(50px);"></div>
    </div>
</div>

</body>
</html>
